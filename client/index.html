<!DOCTYPE html>
<html lang="en" style="background-color: #07080B;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JIMS CampusOps | Autonomous Campus Maintenance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      html, body {
        background-color: #07080B;
        color: #f8fafc;
        margin: 0;
        padding: 0;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      }
    </style>
  </head>
  <body class="bg-[#07080B] text-slate-100 antialiased font-sans min-h-screen selection:bg-fuchsia-500 selection:text-white" style="background-color: #07080B;">
    <div id="root">
      <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #07080B; color: #94a3b8; font-family: sans-serif;">
        <div style="text-align: center;">
          <div style="width: 36px; height: 36px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #d946ef; border-radius: 50%; margin: 0 auto 16px; animation: campusSpin 0.8s linear infinite;"></div>
          <div style="font-weight: 600; color: #f1f5f9; font-size: 14px; letter-spacing: -0.01em;">Loading JIMS CampusOps...</div>
        </div>
      </div>
      <style>@keyframes campusSpin { to { transform: rotate(360deg); } }</style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
